[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-neural-computing"
version = "0.1.0.dev0"
description = "Governed runtime and research platform for dynamic computation graphs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Dynamic Neural Computing contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]
torch = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dnc.schemas" = ["*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--strict-config --strict-markers"
markers = [
  "live_provider: opt-in live provider qualification requiring external services",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
