name: DNC quality gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile source
        run: python -m compileall -q src
      - name: Lint production source
        run: python -m ruff check src
      - name: Run authoritative test suite
        run: python -m pytest -q
      - name: Run canonical lifecycle audit
        run: python scripts/audits/phase12_system_audit.py
      - name: Verify specification references
        run: python tools/fix_refs.py --verify
      - name: Verify normative invariant wording
        run: python tools/fix_refs.py --rfc2119
      - name: Verify architecture conformance
        run: python tools/generate_conformance_report.py --check --out conformance-report-ci.md
